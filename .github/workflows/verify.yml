name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify-release.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pinned toolchain, Mathlib cache and build land on the root disk,
      # so clear preinstalled SDKs first.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install the pinned arithmetic package
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          if [ -f requirements.txt ]; then "$RUNNER_TEMP/venv/bin/python" -m pip install -r requirements.txt; fi
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Pinned Lean 4.33.1 and Mathlib
        run: |
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/lean.tar.zst" https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst
          echo "890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/lean-4.33.1-linux/bin:$PATH"
          echo "$RUNNER_TEMP/lean-4.33.1-linux/bin" >> "$GITHUB_PATH"
          git init -q "$RUNNER_TEMP/mathlib4"
          git -C "$RUNNER_TEMP/mathlib4" fetch -q --depth 1 https://github.com/leanprover-community/mathlib4.git 0df444a360eaa60ab8c11dca51a86af692955474
          git -C "$RUNNER_TEMP/mathlib4" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/mathlib4" rev-parse HEAD)" = 0df444a360eaa60ab8c11dca51a86af692955474
          (cd "$RUNNER_TEMP/mathlib4" && lake exe cache get)
      - name: Certificates and Lean check
        run: sh verify-release.sh "$RUNNER_TEMP/mathlib4"
